name: Development Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Verify release contracts
        run: ruby scripts/verify-release.rb

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install SwiftGen
        run: brew install swiftgen

      - name: Test CLI
        run: swift test --package-path CLI

      - name: Build development packages
        run: make dmg VERSION="commit.${GITHUB_SHA}"

      - name: Verify development DMGs
        run: |
          set -euo pipefail
          hdiutil verify "build/ConfigForge-commit.${GITHUB_SHA}-x86_64.dmg"
          hdiutil verify "build/ConfigForge-commit.${GITHUB_SHA}-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: ConfigForge-commit.${{ github.sha }}
          path: build/*.dmg
          if-no-files-found: error
          retention-days: 90
