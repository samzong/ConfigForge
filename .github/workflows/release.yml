name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Verify SemVer tag and tracked Info.plist
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]]; then
            echo "::error::Invalid SemVer release tag: $RELEASE_TAG"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          core="${version%%-*}"
          plist_short="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' ConfigForge/Info.plist)"
          [[ "$plist_short" == "$core" ]] || { echo "::error::Info.plist does not match $core"; exit 1; }
          plist_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' ConfigForge/Info.plist)"
          [[ "$plist_build" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid bundle build number"; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]] || exit 1
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install SwiftGen
        run: brew install swiftgen

      - name: Build packages
        run: make dmg VERSION="$VERSION"

      - name: Verify DMGs
        run: |
          set -euo pipefail
          hdiutil verify "build/ConfigForge-${VERSION}-x86_64.dmg"
          hdiutil verify "build/ConfigForge-${VERSION}-arm64.dmg"

      - name: Create or update tag-scoped release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--prerelease=false --latest)
          fi
          assets=("build/ConfigForge-${VERSION}-x86_64.dmg" "build/ConfigForge-${VERSION}-arm64.dmg")
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > release-state; then
            [[ "$(cat release-state)" == "true" ]] || { echo "::error::Release is already published"; exit 1; }
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --draft=false "${args[@]}"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --generate-notes "${args[@]}"
          fi
